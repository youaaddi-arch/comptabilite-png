<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaNo P2P — Trésorerie & finance · Paris Nord Groupe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,50 43,43 50,3 57,43' fill='%231b2a4a'/%3E%3Cpolygon points='50,50 57,43 97,50 57,57' fill='%231b2a4a'/%3E%3Cpolygon points='50,50 57,57 50,97 43,57' fill='%23b9985a'/%3E%3Cpolygon points='50,50 43,57 3,50 43,43' fill='%23b9985a'/%3E%3C/svg%3E" />
  <meta name="description" content="Plateforme comptable type Pennylane / Yooz pour le Groupe Paris Nord : OCR factures, reconnaissance société, plan comptable, rapprochement bancaire, TVA, financements OPCO/CPF/France Travail." />
  <!-- Tailwind (Play CDN — chargé par le navigateur) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js (graphiques KPI) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Tesseract.js (OCR réel, gratuit, dans le navigateur) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- PDF.js (rendu des PDF pour l'OCR) — build legacy UMD -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
  <!-- Google Identity Services (OAuth navigateur : Gmail + Drive, sans mot de passe) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="assets/css/app.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } };
    // Afficheur d'erreur visible (évite la page blanche muette)
    window.addEventListener("error", function (e) {
      var box = document.getElementById("fatalError");
      if (!box) {
        box = document.createElement("div");
        box.id = "fatalError";
        box.style.cssText = "position:fixed;inset:0;z-index:99999;background:#fff;color:#b91c1c;font-family:monospace;padding:24px;overflow:auto;font-size:13px";
        document.body && document.body.appendChild(box);
      }
      box.innerHTML = "<h2 style='color:#b91c1c'>⚠️ Erreur de chargement</h2>"
        + "<p style='color:#334155'>Copiez ce message et envoyez-le :</p>"
        + "<pre style='white-space:pre-wrap;background:#fef2f2;padding:12px;border-radius:8px'>"
        + (e.message || e) + "\n\nFichier : " + (e.filename || "?") + "  ligne " + (e.lineno || "?")
        + "</pre><p style='color:#64748b'>Astuce : Cmd+Shift+R pour recharger sans cache, ou tapez dans la console : <code>localStorage.clear()</code> puis rechargez.</p>";
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-100 flex flex-col fixed h-screen z-20">
      <div class="px-5 py-5 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="shrink-0" aria-label="PaNo">
            <!-- étoile à 4 branches : bleu nuit (haut/droite) + or (bas/gauche) -->
            <polygon points="50,50 43,43 50,3 57,43" fill="#1b2a4a"/>
            <polygon points="50,50 57,43 97,50 57,57" fill="#1b2a4a"/>
            <polygon points="50,50 57,57 50,97 43,57" fill="#b9985a"/>
            <polygon points="50,50 43,57 3,50 43,43" fill="#b9985a"/>
          </svg>
          <div class="leading-none">
            <p class="leading-none"><span style="color:#1b2a4a;font-weight:800;font-size:20px;letter-spacing:-0.3px">PaNo</span><span class="text-[10px] font-semibold text-amber-600 ml-1.5 align-top">P2P</span></p>
            <p class="text-[8.5px] tracking-[0.15em] text-slate-400 mt-1">by PARIS NORD GROUPE</p>
          </div>
        </div>
      </div>
      <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
      <div class="p-3 border-t border-slate-100">
        <button id="btnReset" class="w-full text-xs text-slate-400 hover:text-slate-600 py-2">↺ Réinitialiser les données démo</button>
      </div>
    </aside>

    <!-- Contenu -->
    <main class="flex-1 ml-64">
      <header class="bg-white/80 backdrop-blur border-b border-slate-100 px-8 py-3 sticky top-0 z-10 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <label class="text-xs text-slate-400">Société :</label>
          <select id="globalSoc" class="border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-medium text-slate-700 bg-white max-w-[260px]"></select>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-400">Mai 2026</span>
          <span class="text-xs text-slate-400">youaaddi@parisnordgroupe.fr</span>
          <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-semibold text-slate-500">PN</div>
        </div>
      </header>
      <div id="view" class="p-8"></div>
    </main>
  </div>

  <!-- Modale -->
  <div id="modal" class="hidden"></div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg opacity-0 translate-y-3 transition-all duration-300 z-50" style="background:#1e293b"></div>

  <!-- Scripts (ordre de dépendance) — ?v= force le rechargement après chaque mise à jour (anti-cache) -->
  <script src="assets/js/data.js?v=20260603f"></script>
  <script src="assets/js/seed.js?v=20260603f"></script>
  <script src="assets/js/utils.js?v=20260603f"></script>
  <script src="assets/js/ocr.js?v=20260603f"></script>
  <script src="assets/js/gdrive.js?v=20260603f"></script>
  <script src="assets/js/store.js?v=20260603f"></script>
  <script src="assets/js/views.js?v=20260603f"></script>
  <script src="assets/js/app.js?v=20260603f"></script>
</body>
</html>
